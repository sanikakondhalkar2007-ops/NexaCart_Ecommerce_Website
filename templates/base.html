<!doctype html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="i_Xtklgjg6Nu75B4smmiGZ_AXWuBqu-Pa1wW3jt4iv4" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexaCart{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="nav">
  <a class="logo" href="{{ url_for('home') }}">Nexa<span>Cart</span></a>
  <form class="search" action="{{ url_for('products') }}">
    <input name="q" placeholder="Search products..." value="{{ request.args.get('q','') }}">
    <button>🔎</button>
  </form>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('products') }}">Products</a>
    <a href="{{ url_for('compare') }}">Compare</a>
    <a class="cart-link" href="{{ url_for('cart') }}">🛒 Cart <b>{{ cart_count }}</b></a>
  </nav>
</header>
{% block content %}{% endblock %}
<footer><strong>NexaCart</strong> — Smart shopping, made simple. <span>College Project Demo</span></footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
